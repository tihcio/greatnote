[package]
name = "greatnote-desktop"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Tauri desktop shell for Greatnote"

[lib]
name = "greatnote_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
greatnote-core = { path = ".." }
# Chiave API dei provider AI nel portachiavi di sistema (Secret Service su
# Linux, Credential Manager su Windows), mai su file.
# Cartella dati dell'utente per il server MCP avviato senza Tauri (già
# usata da Tauri per lo stesso scopo).
dirs = "7"
keyring = { version = "4.2", default-features = false, features = ["v1"] }
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
# Aggiornamenti in-app (ADR 0023). Senza la funzionalità `zip`: gli
# aggiornamenti sono installer .exe/.msi o AppImage non compressi, e
# l'estrazione di archivi (zip 4.x, RUSTSEC-2026-0367/0368/0369) resta fuori.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }

[dev-dependencies]
tempfile = "3"

# Su Linux/BSD le notifiche dei promemoria sono inviate direttamente (stessa
# libreria usata dal plugin) per poter registrare gli errori di consegna.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
notify-rust = "4.18"
