name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust stable components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test Rust core
        run: cargo test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # npm audit con gli avvisi accettati e motivati in scripts/npm-audit.mjs.
      - name: Audit npm dependencies
        run: node scripts/npm-audit.mjs

  # Avvisi di sicurezza RustSec sull'intero Cargo.lock (desktop incluso).
  # Fallisce solo per vulnerabilità; gli avvisi "unmaintained"/"unsound"
  # delle dipendenze di Tauri e GTK restano visibili nel log.
  rust-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit

  # Pacchetto MSIX del Microsoft Store (ADR 0029): makeappx valida il
  # manifest e i loghi, con il motore llama.cpp e l'identità del prodotto
  # come nella release. Al posto di greatnote-desktop.exe, che qui non viene
  # compilato, si usa un eseguibile di sistema: conta solo la struttura.
  msix-manifest:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Fetch llama.cpp engine
        shell: pwsh
        run: ./scripts/fetch-llama.ps1

      - name: Pack a test MSIX
        shell: pwsh
        run: ./scripts/build-msix.ps1 -ExePath "$env:WINDIR\System32\notepad.exe" -OutDir "$env:RUNNER_TEMP\msix"
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
