name: Installers

# Compila gli installer Windows (NSIS .exe e MSI) e i pacchetti Linux (.deb,
# .rpm, AppImage) su runner puliti. Avvio manuale da "Actions" (solo
# artefatti) oppure con un tag di versione (es. v0.2.0): in quel caso firma
# gli aggiornamenti in-app per Windows e crea una release in bozza con
# installer, firme, latest.json (ADR 0023) e pacchetti Linux (ADR 0024). Gli
# utenti ricevono l'aggiornamento solo quando la bozza viene pubblicata.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      # Necessario solo per creare la release in bozza.
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Motore AI integrato (ADR 0020): serve già alla compilazione, perché
      # tauri.windows.conf.json lo include tra le risorse.
      - name: Fetch llama.cpp engine
        shell: pwsh
        run: ./scripts/fetch-llama.ps1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Test Rust workspace
        run: cargo test --workspace

      # tauri.windows.conf.json viene applicato automaticamente su Windows.
      # Gli ID OAuth sono facoltativi (segreti del repository): se mancano,
      # i collegamenti a Google, Outlook e Dropbox risultano non configurati.
      - name: Build installers
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx tauri build
        env:
          GREATNOTE_GOOGLE_CLIENT_ID: ${{ secrets.GREATNOTE_GOOGLE_CLIENT_ID }}
          GREATNOTE_GOOGLE_CLIENT_SECRET: ${{ secrets.GREATNOTE_GOOGLE_CLIENT_SECRET }}
          GREATNOTE_MICROSOFT_CLIENT_ID: ${{ secrets.GREATNOTE_MICROSOFT_CLIENT_ID }}
          GREATNOTE_DROPBOX_APP_KEY: ${{ secrets.GREATNOTE_DROPBOX_APP_KEY }}

      # Release: installer firmati per gli aggiornamenti in-app. La chiave
      # privata e la sua password sono segreti del repository, mai nel codice.
      - name: Build signed installers for release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: npx tauri build --config src-tauri/tauri.updater.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GREATNOTE_GOOGLE_CLIENT_ID: ${{ secrets.GREATNOTE_GOOGLE_CLIENT_ID }}
          GREATNOTE_GOOGLE_CLIENT_SECRET: ${{ secrets.GREATNOTE_GOOGLE_CLIENT_SECRET }}
          GREATNOTE_MICROSOFT_CLIENT_ID: ${{ secrets.GREATNOTE_MICROSOFT_CLIENT_ID }}
          GREATNOTE_DROPBOX_APP_KEY: ${{ secrets.GREATNOTE_DROPBOX_APP_KEY }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: greatnote-windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Prepare update manifest
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: ./scripts/updater-manifest.ps1 -Tag "${{ github.ref_name }}" -Repository "${{ github.repository }}"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Bozza: si controlla e si pubblica a mano da GitHub › Releases.
      - name: Create draft release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          $files = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe, target/release/bundle/nsis/*-setup.exe.sig, target/release/bundle/msi/*.msi, target/release/bundle/latest.json | ForEach-Object { $_.FullName })
          gh release create "${{ github.ref_name }}" --draft --verify-tag --title "Greatnote ${{ github.ref_name }}" --notes "Vedi CHANGELOG.md. Gli installer non sono firmati con un certificato di firma del codice." @files
        env:
          GH_TOKEN: ${{ github.token }}

  # Pacchetti Linux con il motore llama.cpp integrato (ADR 0024). Ubuntu
  # 22.04: la glibc più vecchia supportata rende .deb e AppImage avviabili
  # anche sulle distribuzioni meno recenti. Con un tag i pacchetti vengono
  # aggiunti alla bozza creata dal job Windows.
  linux:
    runs-on: ubuntu-22.04
    needs: build
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf file

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # tauri.linux.conf.json viene applicato automaticamente su Linux e
      # scarica llama.cpp (scripts/fetch-llama.sh) prima della compilazione.
      - name: Build packages
        run: npx tauri build
        env:
          GREATNOTE_GOOGLE_CLIENT_ID: ${{ secrets.GREATNOTE_GOOGLE_CLIENT_ID }}
          GREATNOTE_GOOGLE_CLIENT_SECRET: ${{ secrets.GREATNOTE_GOOGLE_CLIENT_SECRET }}
          GREATNOTE_MICROSOFT_CLIENT_ID: ${{ secrets.GREATNOTE_MICROSOFT_CLIENT_ID }}
          GREATNOTE_DROPBOX_APP_KEY: ${{ secrets.GREATNOTE_DROPBOX_APP_KEY }}

      # Discover (KDE) mostra un pacchetto locale con il nome del file fino al
      # primo punto: "Greatnote-0.1.2-1.x86_64.rpm" diventerebbe
      # "Greatnote-0". La versione resta nei metadati del pacchetto e nella
      # release.
      - name: Name packages for software centers
        run: |
          mkdir -p target/release/linux-packages
          cp target/release/bundle/rpm/*.rpm target/release/linux-packages/Greatnote.x86_64.rpm
          cp target/release/bundle/deb/*.deb target/release/linux-packages/Greatnote.amd64.deb
          cp target/release/bundle/appimage/*.AppImage target/release/linux-packages/Greatnote.x86_64.AppImage
          ls -l target/release/linux-packages

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: greatnote-linux-x64
          path: target/release/linux-packages/*
          if-no-files-found: error
          retention-days: 30

      # Aggiornamenti in-app su Linux: firma dei pacchetti con la chiave degli
      # aggiornamenti e voci linux-x86_64-* nel latest.json della bozza,
      # creato dal job Windows.
      - name: Sign packages and extend update manifest
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          gh release download "${{ github.ref_name }}" --pattern latest.json --dir target/release
          bash scripts/updater-manifest-linux.sh "${{ github.ref_name }}" "${{ github.repository }}" \
            target/release/linux-packages target/release/latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Add packages to draft release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          gh release upload "${{ github.ref_name }}" target/release/linux-packages/*
          gh release upload "${{ github.ref_name }}" target/release/latest.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
