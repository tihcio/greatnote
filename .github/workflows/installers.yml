name: Installers

# Compila gli installer Windows (NSIS .exe e MSI), i pacchetti Linux (.deb,
# .rpm, AppImage) e APK/AAB Android (solo artefatti) su runner puliti. Avvio
# manuale da "Actions" (solo artefatti) oppure con un tag di versione (es.
# v0.2.0): in quel caso firma
# gli aggiornamenti in-app per Windows e crea una release in bozza con
# installer, firme, latest.json (ADR 0023) e pacchetti Linux (ADR 0024). Gli
# utenti ricevono l'aggiornamento solo quando la bozza viene pubblicata.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      # Necessario solo per creare la release in bozza.
      contents: write
      # L'action di SignPath legge i dettagli del job e scarica gli artefatti.
      actions: read
    env:
      # Firma del codice con SignPath Foundation (ADR 0028): solo per i tag
      # di versione e solo se il progetto SignPath è configurato (variabile
      # del repository SIGNPATH_ORGANIZATION_ID). Senza, la release esce
      # come prima, con installer non firmati.
      SIGN_WINDOWS: ${{ startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Motore AI integrato (ADR 0020): serve già alla compilazione, perché
      # tauri.windows.conf.json lo include tra le risorse.
      - name: Fetch llama.cpp engine
        shell: pwsh
        run: ./scripts/fetch-llama.ps1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Test Rust workspace
        run: cargo test --workspace

      # tauri.windows.conf.json viene applicato automaticamente su Windows.
      # Gli ID OAuth sono facoltativi (segreti del repository): se mancano,
      # i collegamenti a Google, Outlook e Dropbox risultano non configurati.
      - name: Build installers
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx tauri build
        env:
          GREATNOTE_GOOGLE_CLIENT_ID: ${{ secrets.GREATNOTE_GOOGLE_CLIENT_ID }}
          GREATNOTE_GOOGLE_CLIENT_SECRET: ${{ secrets.GREATNOTE_GOOGLE_CLIENT_SECRET }}
          GREATNOTE_MICROSOFT_CLIENT_ID: ${{ secrets.GREATNOTE_MICROSOFT_CLIENT_ID }}
          GREATNOTE_DROPBOX_APP_KEY: ${{ secrets.GREATNOTE_DROPBOX_APP_KEY }}

      # Release senza SignPath: installer firmati solo per gli aggiornamenti
      # in-app. La chiave privata e la sua password sono segreti del
      # repository, mai nel codice.
      - name: Build signed installers for release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.SIGN_WINDOWS != 'true' }}
        run: npx tauri build --config src-tauri/tauri.updater.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GREATNOTE_GOOGLE_CLIENT_ID: ${{ secrets.GREATNOTE_GOOGLE_CLIENT_ID }}
          GREATNOTE_GOOGLE_CLIENT_SECRET: ${{ secrets.GREATNOTE_GOOGLE_CLIENT_SECRET }}
          GREATNOTE_MICROSOFT_CLIENT_ID: ${{ secrets.GREATNOTE_MICROSOFT_CLIENT_ID }}
          GREATNOTE_DROPBOX_APP_KEY: ${{ secrets.GREATNOTE_DROPBOX_APP_KEY }}

      # --- Release con firma del codice SignPath (ADR 0028) ---------------
      # Due richieste di firma, ognuna da approvare su SignPath: prima
      # Greatnote.exe (così l'app installata è firmata), poi gli installer
      # costruiti con l'eseguibile firmato. Le firme minisign degli
      # aggiornamenti vengono rigenerate dopo, sui file definitivi.
      - name: Check release version
        id: version
        if: ${{ env.SIGN_WINDOWS == 'true' }}
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("${{ github.ref_name }}" -ne "v$version") {
            throw "Il tag ${{ github.ref_name }} non corrisponde alla versione dell'app ($version)."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Compile app for code signing
        if: ${{ env.SIGN_WINDOWS == 'true' }}
        run: npx tauri build --no-bundle
        env:
          GREATNOTE_GOOGLE_CLIENT_ID: ${{ secrets.GREATNOTE_GOOGLE_CLIENT_ID }}
          GREATNOTE_GOOGLE_CLIENT_SECRET: ${{ secrets.GREATNOTE_GOOGLE_CLIENT_SECRET }}
          GREATNOTE_MICROSOFT_CLIENT_ID: ${{ secrets.GREATNOTE_MICROSOFT_CLIENT_ID }}
          GREATNOTE_DROPBOX_APP_KEY: ${{ secrets.GREATNOTE_DROPBOX_APP_KEY }}

      - name: Stage app binary for signing
        if: ${{ env.SIGN_WINDOWS == 'true' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force signpath/app | Out-Null
          Copy-Item target/release/Greatnote.exe signpath/app/ -ErrorAction Stop

      - name: Upload unsigned app binary
        id: upload-app
        if: ${{ env.SIGN_WINDOWS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: signpath-app-unsigned
          path: signpath/app/*
          if-no-files-found: error
          retention-days: 1

      - name: Sign app binary with SignPath
        if: ${{ env.SIGN_WINDOWS == 'true' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion: true
          # Lascia il tempo di approvare la richiesta su SignPath.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signpath/app-signed

      - name: Use signed app binary
        if: ${{ env.SIGN_WINDOWS == 'true' }}
        shell: pwsh
        run: |
          $signed = "signpath/app-signed/Greatnote.exe"
          $signature = Get-AuthenticodeSignature $signed
          if ($signature.Status -ne "Valid") {
            throw "Greatnote.exe firmato non valido: $($signature.Status) $($signature.StatusMessage)"
          }
          Write-Host "Firmato da: $($signature.SignerCertificate.Subject)"
          Copy-Item $signed target/release/Greatnote.exe -Force

      - name: Bundle installers with the signed app
        if: ${{ env.SIGN_WINDOWS == 'true' }}
        run: npx tauri bundle --config src-tauri/tauri.updater.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Stage installers for signing
        if: ${{ env.SIGN_WINDOWS == 'true' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force signpath/installers | Out-Null
          Copy-Item target/release/bundle/nsis/*-setup.exe, target/release/bundle/msi/*.msi signpath/installers/ -ErrorAction Stop

      - name: Upload unsigned installers
        id: upload-installers
        if: ${{ env.SIGN_WINDOWS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: signpath-installers-unsigned
          path: signpath/installers/*
          if-no-files-found: error
          retention-days: 1

      - name: Sign installers with SignPath
        if: ${{ env.SIGN_WINDOWS == 'true' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.upload-installers.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signpath/installers-signed

      - name: Use signed installers
        if: ${{ env.SIGN_WINDOWS == 'true' }}
        shell: pwsh
        run: |
          $files = @(Get-ChildItem signpath/installers-signed -File)
          if ($files.Count -eq 0) { throw "Nessun installer firmato ricevuto da SignPath." }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne "Valid") {
              throw "$($file.Name) firmato non valido: $($signature.Status) $($signature.StatusMessage)"
            }
            $folder = if ($file.Extension -eq ".msi") { "msi" } else { "nsis" }
            Copy-Item $file.FullName "target/release/bundle/$folder/$($file.Name)" -Force
            Write-Host "$($file.Name): firmato da $($signature.SignerCertificate.Subject)"
          }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: greatnote-windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Prepare update manifest
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: ./scripts/updater-manifest.ps1 -Tag "${{ github.ref_name }}" -Repository "${{ github.repository }}" -Resign:$${{ env.SIGN_WINDOWS }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Bozza: si controlla e si pubblica a mano da GitHub › Releases.
      - name: Create draft release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          $files = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe, target/release/bundle/nsis/*-setup.exe.sig, target/release/bundle/msi/*.msi, target/release/bundle/latest.json | ForEach-Object { $_.FullName })
          $notes = if ("${{ env.SIGN_WINDOWS }}" -eq "true") {
            "Vedi CHANGELOG.md. Installer Windows firmati: free code signing provided by SignPath.io, certificate by SignPath Foundation. Code signing policy: https://github.com/${{ github.repository }}#code-signing-policy"
          } else {
            "Vedi CHANGELOG.md. Gli installer non sono firmati con un certificato di firma del codice."
          }
          gh release create "${{ github.ref_name }}" --draft --verify-tag --title "Greatnote ${{ github.ref_name }}" --notes $notes @files
        env:
          GH_TOKEN: ${{ github.token }}

  # Pacchetti Linux con il motore llama.cpp integrato (ADR 0024). Ubuntu
  # 22.04: la glibc più vecchia supportata rende .deb e AppImage avviabili
  # anche sulle distribuzioni meno recenti. Con un tag i pacchetti vengono
  # aggiunti alla bozza creata dal job Windows.
  linux:
    runs-on: ubuntu-22.04
    needs: build
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf file

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # tauri.linux.conf.json viene applicato automaticamente su Linux e
      # scarica llama.cpp (scripts/fetch-llama.sh) prima della compilazione.
      - name: Build packages
        run: npx tauri build
        env:
          GREATNOTE_GOOGLE_CLIENT_ID: ${{ secrets.GREATNOTE_GOOGLE_CLIENT_ID }}
          GREATNOTE_GOOGLE_CLIENT_SECRET: ${{ secrets.GREATNOTE_GOOGLE_CLIENT_SECRET }}
          GREATNOTE_MICROSOFT_CLIENT_ID: ${{ secrets.GREATNOTE_MICROSOFT_CLIENT_ID }}
          GREATNOTE_DROPBOX_APP_KEY: ${{ secrets.GREATNOTE_DROPBOX_APP_KEY }}

      # Discover (KDE) mostra un pacchetto locale con il nome del file fino al
      # primo punto: "Greatnote-0.1.2-1.x86_64.rpm" diventerebbe
      # "Greatnote-0". La versione resta nei metadati del pacchetto e nella
      # release.
      - name: Name packages for software centers
        run: |
          mkdir -p target/release/linux-packages
          cp target/release/bundle/rpm/*.rpm target/release/linux-packages/Greatnote.x86_64.rpm
          cp target/release/bundle/deb/*.deb target/release/linux-packages/Greatnote.amd64.deb
          cp target/release/bundle/appimage/*.AppImage target/release/linux-packages/Greatnote.x86_64.AppImage
          ls -l target/release/linux-packages

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: greatnote-linux-x64
          path: target/release/linux-packages/*
          if-no-files-found: error
          retention-days: 30

      # Aggiornamenti in-app su Linux: firma dei pacchetti con la chiave degli
      # aggiornamenti e voci linux-x86_64-* nel latest.json della bozza,
      # creato dal job Windows.
      - name: Sign packages and extend update manifest
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          gh release download "${{ github.ref_name }}" --pattern latest.json --dir target/release
          bash scripts/updater-manifest-linux.sh "${{ github.ref_name }}" "${{ github.repository }}" \
            target/release/linux-packages target/release/latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Add packages to draft release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          gh release upload "${{ github.ref_name }}" target/release/linux-packages/*
          gh release upload "${{ github.ref_name }}" target/release/latest.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  # Android (docs/ANDROID_PORTING.md, fase G): APK e AAB di rilascio per
  # telefoni arm64, solo come artefatti. Non vengono aggiunti alla release:
  # la versione Android non è ancora distribuita. Senza i segreti della
  # chiave di firma i pacchetti escono non firmati (l'APK non si installa
  # finché non viene firmato).
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Rust stable with the Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # NDK preinstallato sul runner; app/build.gradle.kts usa la stessa
      # versione per togliere i simboli dalla libreria nativa.
      - name: Select the Android NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      # La chiave arriva dai segreti del repository come base64 e resta solo
      # nella cartella temporanea del runner.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GREATNOTE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/greatnote-release.jks"
            echo "GREATNOTE_ANDROID_KEYSTORE=$RUNNER_TEMP/greatnote-release.jks" >> "$GITHUB_ENV"
            echo "Chiave di firma presente: pacchetti firmati."
          else
            echo "::warning::GREATNOTE_ANDROID_KEYSTORE_BASE64 non configurato: APK e AAB non firmati."
          fi

      - name: Build APK and AAB
        run: npx tauri android build --target aarch64 --apk --aab
        env:
          GREATNOTE_DROPBOX_APP_KEY: ${{ secrets.GREATNOTE_DROPBOX_APP_KEY }}
          GREATNOTE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.GREATNOTE_ANDROID_KEYSTORE_PASSWORD }}
          GREATNOTE_ANDROID_KEY_ALIAS: ${{ secrets.GREATNOTE_ANDROID_KEY_ALIAS }}
          GREATNOTE_ANDROID_KEY_PASSWORD: ${{ secrets.GREATNOTE_ANDROID_KEY_PASSWORD }}

      - name: Collect packages
        run: |
          mkdir -p android-packages
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk android-packages/
          cp src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab android-packages/
          rm -f "$RUNNER_TEMP/greatnote-release.jks"
          ls -l android-packages

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: greatnote-android-arm64
          path: android-packages/*
          if-no-files-found: error
          retention-days: 30
