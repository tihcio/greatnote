        encrypt_note_text: (args) => {
          if (args.passphrase.length < 8) throw "weak-passphrase";
          const body = btoa(String.fromCharCode(...new TextEncoder().encode(args.text + "|" + Math.random())));
          const armored = `-----BEGIN AGE ENCRYPTED FILE-----\n${body}\n-----END AGE ENCRYPTED FILE-----`;
          secrets.set(armored, { text: args.text, passphrase: args.passphrase });
          return armored;
        },

          const secret = secrets.get(args.ciphertext);
